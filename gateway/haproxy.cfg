global
    log stdout format raw local0
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

resolvers docker_resolver
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    hold obsolete   10s
    hold nx         10s
    hold refused    10s
    hold other      10s
    hold timeout    10s

frontend http-in
    bind *:80

    # single stick-table backing BOTH counters used below
    stick-table type ip size 60k expire 30s store conn_cur,http_req_rate(10s)

    tcp-request connection reject if { src_conn_cur ge 100 }
    tcp-request connection track-sc1 src

    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

    option forwardfor
    http-request add-header X-Forwarded-Proto http

    # --- dev/build split: capture BEFORE stripping, since ACLs re-evaluate live ---
    acl is_dev path_beg /dev/
    http-request set-var(txn.dev) bool(true) if is_dev
    http-request replace-path ^/dev(/.*)$ \1 if is_dev
    # everything below now sees an identical path for /dev/... and non-/dev/... traffic

    acl model_ws        path_beg /api/v1/models/ws
    acl model_models_ws path_beg /api/models/ws
    acl model_v1_models path_beg /api/v1/models
    acl agentic_benchmark path_beg /api/v1/agentic-benchmark
    acl failure_history path_beg /api/models/failure-mode-history
    acl failure_records path_beg /api/models/failure-mode-records
    acl model_models     path_beg /api/models

    acl tb_api    path_beg /api/ws /api/ /static/rulenode/ /static/widgets/ /oauth2/ /login/oauth2/

    acl ai_agent  path_beg /api/ai-agent/

    http-request return status 404 content-type text/plain string "not found" if !model_ws !model_models_ws !model_v1_models !agentic_benchmark !failure_history !failure_records !model_models !tb_api

    use_backend ai-agent if ai_agent

    use_backend quarkus-v1-models-ws-backend-dev      if model_ws { var(txn.dev) -m bool }
    use_backend quarkus-v1-models-ws-backend          if model_ws

    use_backend quarkus-models-ws-backend-dev         if model_models_ws { var(txn.dev) -m bool }
    use_backend quarkus-models-ws-backend             if model_models_ws

    use_backend quarkus-models-backend-dev            if model_v1_models { var(txn.dev) -m bool }
    use_backend quarkus-models-backend                if model_v1_models

    use_backend quarkus-agentic-benchmark-backend-dev if agentic_benchmark { var(txn.dev) -m bool }
    use_backend quarkus-agentic-benchmark-backend     if agentic_benchmark

    use_backend failuremode-backend-dev               if failure_history { var(txn.dev) -m bool }
    use_backend failuremode-backend                   if failure_history

    use_backend failuremode-backend-dev               if failure_records { var(txn.dev) -m bool }
    use_backend failuremode-backend                   if failure_records

    use_backend model-models-backend-dev              if model_models { var(txn.dev) -m bool }
    use_backend model-models-backend                  if model_models

    use_backend tb-backend if tb_api

# --- build backends (unchanged) ---
backend model-models-backend
    http-request replace-path ^/api/models(.*)$ /api/v1/models\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-models-ws-backend
    http-request replace-path ^/api/models/ws(.*)$ /models/ws\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-v1-models-ws-backend
    http-request replace-path ^/api/v1/models/ws(.*)$ /models/ws\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend failuremode-backend
    http-request replace-path ^/api/models(.*)$ /api/v1/models\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-models-backend
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-agentic-benchmark-backend
    server tb-quarkus ${QUARKUS_BACKEND_HOST}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

# --- dev backends (mirror build, point at QUARKUS_BACKEND_HOST_DEV) ---
backend model-models-backend-dev
    http-request replace-path ^/api/models(.*)$ /api/v1/models\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-models-ws-backend-dev
    http-request replace-path ^/api/models/ws(.*)$ /models/ws\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-v1-models-ws-backend-dev
    http-request replace-path ^/api/v1/models/ws(.*)$ /models/ws\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend failuremode-backend-dev
    http-request replace-path ^/api/models(.*)$ /api/v1/models\1
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-models-backend-dev
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend quarkus-agentic-benchmark-backend-dev
    server tb-quarkus ${QUARKUS_BACKEND_HOST_DEV}:8081 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend tb-backend
    http-request set-header Host %[hdr(host)]
    server tb thingsboard:8080 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend ai-agent
    http-request set-header Host %[hdr(host)]
    http-request replace-path ^/api/ai-agent(.*)$ \1
    server ai-agent ai-agent:8300 check inter 5s resolvers docker_resolver resolve-prefer ipv4
