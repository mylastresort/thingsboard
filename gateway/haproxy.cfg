global
  ulimit-n 100000
  maxconn 20000
  log 127.0.0.1 local0

defaults
  log global
  mode http
  option httplog
  timeout connect 5000ms
  timeout client  60000ms
  timeout server  60000ms
  timeout tunnel  1h
  default-server init-addr none

resolvers docker_resolver
  nameserver dns 127.0.0.11:53

listen stats
  bind *:9999
  stats enable
  stats hide-version
  stats uri /stats
  stats auth admin:admin

backend st_rate10s
  stick-table type ip size 60k expire 10s store http_req_rate(10s)

frontend http-in
  bind *:80

  stick-table type ip size 60k expire 30s store conn_cur
  tcp-request connection reject if { src_conn_cur ge 100 }
  tcp-request connection track-sc1 src

  http-request track-sc0 src table st_rate10s
  http-request deny deny_status 429 if { sc_http_req_rate(0) gt 200 }

  option forwardfor
  http-request add-header X-Forwarded-Proto http

  acl model_v1        path_beg /api/v1/
  acl model_models     path_beg /api/models
  acl model_pm         path_beg /api/predictiveMaintenance
  acl model_forecasts  path_beg /api/forecasts
  acl model_devices    path_beg /api/devices-with-models
  acl model_notify     path_beg /api/notify

  acl tb_api    path_beg /api/ws /api/ /static/rulenode/ /static/widgets/ /oauth2/ /login/oauth2/

  acl ai_agent  path_beg /api/ai-agent/

  http-request return status 404 content-type text/plain string "not found" if !model_v1 !model_models !model_pm !model_forecasts !model_devices !model_notify !tb_api

  use_backend ai-agent                if ai_agent
  use_backend model-backend           if model_v1
  use_backend model-models-backend    if model_models
  use_backend model-pm-backend        if model_pm
  use_backend model-forecasts-backend if model_forecasts
  use_backend model-devices-backend   if model_devices
  use_backend model-backend           if model_notify
  use_backend tb-backend              if tb_api

backend model-backend
  http-request set-header Host %[hdr(host)]
  server model model:8000 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend model-models-backend
  http-request replace-path ^/api/models(.*)$ /api/v1/models\1
  server model model:8000 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend model-pm-backend
  http-request replace-path ^/api/predictiveMaintenance(.*)$ /api/v1/predictiveMaintenance\1
  server model model:8000 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend model-forecasts-backend
  http-request replace-path ^/api/forecasts(.*)$ /api/v1/forecast\1
  server model model:8000 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend model-devices-backend
  http-request replace-path ^/api/devices-with-models(.*)$ /api/v1/devices-with-models\1
  server model model:8000 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend tb-backend
  http-request set-header Host %[hdr(host)]
  server tb thingsboard:8080 check inter 5s resolvers docker_resolver resolve-prefer ipv4

backend ai-agent
  http-request set-header Host %[hdr(host)]
  http-request replace-path ^/api/ai-agent(.*)$ \1
  server ai-agent ai-agent:8300 check inter 5s resolvers docker_resolver resolve-prefer ipv4
