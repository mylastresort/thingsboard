server:
  address: "0.0.0.0"
  port: "8090"
thingsboard:
  enableProxy: "true"
  host: thingsboard   # matches your container_name
  port: "8080"
security:
  headers:
    x-content-type-options:
      enabled: true
    referrer-policy:
      enabled: true
      value: "strict-origin-when-cross-origin"
    x-frame-options:
      enabled: false
      value: "SAMEORIGIN"
    content-security-policy:
      enabled: false
      value: ""
      report-only: false
logger:
  level: "info"
  path: "logs"
  filename: "tb-web-ui-%DATE%.log"