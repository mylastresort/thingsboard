services:
  ws-events:
    build:
      context: ./send-telemetry
      dockerfile: ws-events.Dockerfile
    container_name: tb-lts43-monolith-ws-events
    volumes:
      - .:/app
    depends_on:
      thingsboard:
        condition: service_started

  tb-web-ui-dev:
    build:
      context: ./ui-ngx
      dockerfile: .Dockerfile
    container_name: tb-lts43-monolith-tb-web-ui-dev
    working_dir: /app
    volumes:
      - ./ui-ngx:/app
    environment:
      - GATEWAY_URL=http://gateway:80
      - AI_AGENT_URL=http://ai-agent:8300
    command: sh ./entrypoint.sh
    ports:
      - "4200:4200"
    depends_on:
      thingsboard:
        condition: service_started # downgraded — no healthcheck to wait on
      gateway:
        condition: service_started

  tb-quarkus-dev:
    image: eclipse-temurin:21-jdk
    container_name: tb-lts43-monolith-tb-quarkus-dev
    working_dir: /workspace
    volumes:
      - ./tb-quarkus:/workspace
      - ./tb_quarkus_dev_cache/gradle:/root/.gradle
      - ./tb_quarkus_dev_cache/runtime:/workspace/.quarkus
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}?currentSchema=tb_quarkus
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8081"
      - "5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ./gradlew quarkusDev --no-daemon -Dquarkus.http.host=0.0.0.0 -Dquarkus.http.port=8081

  tb-quarkus-cmd-dev:
    build:
      context: ./tb-quarkus/cmd
      dockerfile: Dockerfile
    image: tb-quarkus-cmd:dev
    container_name: tb-lts43-monolith-tb-quarkus-cmd-dev
    environment:
      TB_URL: http://thingsboard:8080
      TB_USERNAME: ${TB_USERNAME:-tenant@thingsboard.org}
      TB_PASSWORD: ${TB_PASSWORD:-tenant}
      HF_TOKEN: ${HF_TOKEN:-}
      QUARKUS_LOG_CATEGORY__IO_QUARKUS__LEVEL: WARN
    entrypoint: ["tail", "-f", "/dev/null"]
    depends_on:
      thingsboard:
        condition: service_started

  tb-quarkus-kafka:
    image: apache/kafka:4.2.0
    container_name: tb-lts43-monolith-tb-quarkus-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://tb-quarkus-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@tb-quarkus-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - tb-quarkus-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  tb-quarkus-kafka-data:
