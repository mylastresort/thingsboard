services:
  ws-events:
    build:
      context: ./send-telemetry
      dockerfile: ws-events.Dockerfile
    container_name: tb-lts43-monolith-ws-events
    volumes:
      - .:/app
    depends_on:
      thingsboard:
        condition: service_started

  tb-web-ui-dev:
    build:
      context: ./ui-ngx
      dockerfile: .Dockerfile
    container_name: tb-lts43-monolith-tb-web-ui-dev
    working_dir: /app
    volumes:
      - ./ui-ngx:/app
    environment:
      - GATEWAY_URL=http://gateway:80
      - AI_AGENT_URL=http://ai-agent:8300
    command: sh ./entrypoint.sh
    ports:
      - "4200:4200"
    depends_on:
      thingsboard:
        condition: service_started # downgraded — no healthcheck to wait on
      gateway:
        condition: service_started

  tb-quarkus-dev:
    image: eclipse-temurin:21-jdk
    container_name: tb-lts43-monolith-tb-quarkus-dev
    working_dir: /workspace
    volumes:
      - ./tb-quarkus:/workspace
      - ./tb_quarkus_dev_cache/gradle:/root/.gradle
      - ./tb_quarkus_dev_cache/runtime:/workspace/.quarkus
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}?currentSchema=tb_quarkus
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8081"
      - "5005:5005"
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    command: ./gradlew quarkusDev --no-daemon -Dquarkus.http.host=0.0.0.0 -Dquarkus.http.port=8081
