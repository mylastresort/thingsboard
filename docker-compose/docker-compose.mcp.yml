services:
  thingsboard-mcp:
    build:
      context: thingsboard-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WAIT_HOSTS: "thingsboard:8080"
      THINGSBOARD_URL: "http://thingsboard:8080"
      THINGSBOARD_API_KEY: "${TB_MCP_API_KEY:-}"
      THINGSBOARD_USERNAME: "${TB_MCP_USERNAME:-tenant@thingsboard.org}"
      THINGSBOARD_PASSWORD: "${TB_MCP_PASSWORD:-tenant}"
      SPRING_AI_MCP_SERVER_STDIO: "false"
      SPRING_WEB_APPLICATION_TYPE: servlet
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "8000"
    ports:
      - "${MCP_PORT:-8201}:8000"
    depends_on:
      thingsboard:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:0.30.11
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./.ollama:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q4_0"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12G
        reservations:
          cpus: "1.0"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai-agent-py:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${TINY_AGENT_MODEL:-glm-4.7-flash:q4_K_M}"
      OLLAMA_NUM_CTX: "${TINY_AGENT_OLLAMA_NUM_CTX:-120000}"
      MAX_STEPS: "30"
      MAX_TOOLS_PER_QUERY: "${TINY_AGENT_MAX_TOOLS_PER_QUERY:-20}"
      # Prompt: Detect unusual vibration, temperature, or pressure changes in machinery in building 1
      # Ollama on RTX 4090 box (~21GB free VRAM idle).
      # Tested combos to try, roughly ordered safest -> riskiest for VRAM:
      #   4. qwen3:8b  @ num_ctx=65536 -> ~6GB, plenty of headroom, fast
      #   4. qwen3:14b  @ num_ctx=32768  -> ~13GB, best headroom if 14B quality ok
      #   1. qwen3:14b  @ num_ctx=16384  -> ~11GB total, plenty of headroom, fast
      #   2. qwen3:32b  @ num_ctx=12288  -> ~22-23GB, small bump from current 8192
      #   3. qwen3:32b  @ num_ctx=16384  -> ~22-23GB, only if #2 fits w/o OOM
      MCP_SERVER_URL: "http://thingsboard-mcp:8000/sse"
      MAX_ALARM_PAGES: "${TINY_AGENT_MAX_ALARM_PAGES:-1}"
      MAX_OBSERVATION_CHARS: "${TINY_AGENT_MAX_OBSERVATION_CHARS:-2000}"
      PORT: "8300"
      PANDAS_MCP_SERVER_URL: "http://pandas-mcp:8000/sse"
      PDM_MCP_SERVER_URL: "http://tb-quarkus:8081/mcp/sse"
      # Redis-backed session persistence (makes ai-agent-py stateless).
      # Empty -> falls back to per-agent local SQLite under .adk/.
      SESSION_SERVICE_URI: "${SESSION_SERVICE_URI:-redis://redis:6379/0}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "http://langfuse:3000"
    ports:
      - "${TINY_AGENT_PORT:-8300}:8300"
    depends_on:
      thingsboard-mcp:
        condition: service_healthy
      tb-quarkus:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  langfuse-db-init:
    image: postgres:18-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    command: >
      sh -c "until pg_isready -h $$PGHOST -p $$PGPORT -U $$PGUSER; do sleep 1; done &&
             psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -tc \"SELECT 1 FROM pg_database WHERE datname='langfuse'\" | grep -q 1 ||
             psql -h $$PGHOST -p $$PGPORT -U $$PGUSER -c 'CREATE DATABASE langfuse'"
    depends_on:
      postgres:
        condition: service_healthy

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    entrypoint: ["./langfuse-entrypoint.sh"]
    volumes:
      - ./docker-compose/langfuse-entrypoint.sh:/app/langfuse-entrypoint.sh:ro
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-super-secret-dev-key-change-in-prod}"
      SALT: "${LANGFUSE_SALT:-super-secret-salt-change-in-prod}"
      HOSTNAME: "0.0.0.0"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  pandas-mcp:
    build:
      context: ./pandas-mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "8000"
      PANDAS_MCP_LOG_LEVEL: "${PANDAS_MCP_LOG_LEVEL:-INFO}"
    ports:
      - "${PANDAS_MCP_PORT:-8202}:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
