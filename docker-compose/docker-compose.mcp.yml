services:
  thingsboard-mcp:
    build:
      context: thingsboard-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WAIT_HOSTS: "thingsboard:8080"
      THINGSBOARD_URL: "http://thingsboard:8080"

      # ── authentication ───────────────────────────────────────────────────
      # API key takes priority when the image is started; leave blank to use
      # username/password instead.
      THINGSBOARD_API_KEY: "${TB_MCP_API_KEY:-}"
      THINGSBOARD_USERNAME: "${TB_MCP_USERNAME:-tenant@thingsboard.org}"
      THINGSBOARD_PASSWORD: "${TB_MCP_PASSWORD:-tenant}"

      # ── transport: SSE HTTP service (not a STDIO subprocess) ─────────────
      SPRING_AI_MCP_SERVER_STDIO: "false"
      SPRING_WEB_APPLICATION_TYPE: servlet
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "8000"

    ports:
      - "${MCP_PORT:-8201}:8000"

    depends_on:
      - thingsboard

  ollama:
    image: ollama/ollama:0.30.11
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ../.ollama:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 5 &&
       ollama pull qwen2.5:7b &&
       wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ai-agent:
  #   build:
  #     context: ./ai-agent
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   environment:
  #     OLLAMA_BASE_URL: "http://ollama:11434"
  #     OLLAMA_MODEL: "${TINY_AGENT_MODEL:-qwen2.5:7b}"
  #     OLLAMA_NUM_CTX: "${TINY_AGENT_OLLAMA_NUM_CTX:-1024}"
  #     MCP_SERVER_URL: "http://thingsboard-mcp:8000/sse"
  #     MAX_STEPS: "8"
  #     MAX_TOOLS_PER_QUERY: "${TINY_AGENT_MAX_TOOLS_PER_QUERY:-20}"
  #     MAX_ALARM_PAGES: "${TINY_AGENT_MAX_ALARM_PAGES:-1}"
  #     MAX_OBSERVATION_CHARS: "${TINY_AGENT_MAX_OBSERVATION_CHARS:-2000}"
  #     PORT: "8300"
  #   ports:
  #     - "${TINY_AGENT_PORT:-8300}:8300"
  #   depends_on:
  #     - thingsboard-mcp
  #     - ollama

  ai-agent-py:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${TINY_AGENT_MODEL:-qwen2.5:7b}"
      OLLAMA_NUM_CTX: "${TINY_AGENT_OLLAMA_NUM_CTX:-8192}"
      MCP_SERVER_URL: "http://thingsboard-mcp:8000/sse"
      MAX_STEPS: "8"
      MAX_TOOLS_PER_QUERY: "${TINY_AGENT_MAX_TOOLS_PER_QUERY:-20}"
      MAX_ALARM_PAGES: "${TINY_AGENT_MAX_ALARM_PAGES:-1}"
      MAX_OBSERVATION_CHARS: "${TINY_AGENT_MAX_OBSERVATION_CHARS:-2000}"
      PORT: "8300"
    ports:
      - "${TINY_AGENT_PORT:-8300}:8300"
    depends_on:
      - thingsboard-mcp
      - ollama
