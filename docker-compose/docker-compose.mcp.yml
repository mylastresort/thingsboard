services:
  thingsboard-mcp:
    build:
      context: thingsboard-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WAIT_HOSTS: "thingsboard:8080"
      THINGSBOARD_URL: "http://thingsboard:8080"
      THINGSBOARD_API_KEY: "${TB_MCP_API_KEY:-}"
      THINGSBOARD_USERNAME: "${TB_MCP_USERNAME:-tenant@thingsboard.org}"
      THINGSBOARD_PASSWORD: "${TB_MCP_PASSWORD:-tenant}"
      SPRING_AI_MCP_SERVER_STDIO: "false"
      SPRING_WEB_APPLICATION_TYPE: servlet
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "8000"
    ports:
      - "${MCP_PORT:-8201}:8000"
    depends_on:
      thingsboard:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    profiles:
      - local-ollama
    image: ollama/ollama:0.30.11
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./.ollama:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 5 &&
       ollama pull qwen3:8b &&
       wait"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12G
        reservations:
          cpus: "1.0"
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ai-agent-py:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${TINY_AGENT_MODEL:-glm-4.7-flash:q4_K_M}"
      OLLAMA_NUM_CTX: "${TINY_AGENT_OLLAMA_NUM_CTX:-120000}"
      MAX_STEPS: "30"
      MAX_TOOLS_PER_QUERY: "${TINY_AGENT_MAX_TOOLS_PER_QUERY:-20}"
      # Prompt: Detect unusual vibration, temperature, or pressure changes in machinery in building 1
      # Ollama on RTX 4090 box (~21GB free VRAM idle).
      # Tested combos to try, roughly ordered safest -> riskiest for VRAM:
      #   4. qwen3:8b  @ num_ctx=65536 -> ~6GB, plenty of headroom, fast
      #   4. qwen3:14b  @ num_ctx=32768  -> ~13GB, best headroom if 14B quality ok
      #   1. qwen3:14b  @ num_ctx=16384  -> ~11GB total, plenty of headroom, fast
      #   2. qwen3:32b  @ num_ctx=12288  -> ~22-23GB, small bump from current 8192
      #   3. qwen3:32b  @ num_ctx=16384  -> ~22-23GB, only if #2 fits w/o OOM
      MCP_SERVER_URL: "http://thingsboard-mcp:8000/sse"
      MAX_ALARM_PAGES: "${TINY_AGENT_MAX_ALARM_PAGES:-1}"
      MAX_OBSERVATION_CHARS: "${TINY_AGENT_MAX_OBSERVATION_CHARS:-2000}"
      PORT: "8300"
      PANDAS_MCP_SERVER_URL: "http://pandas-mcp:8000/sse"
      PDM_MCP_SERVER_URL: "http://tb-quarkus:8081/mcp/sse"
      WO_MCP_SERVER_URL: "http://wo-mcp-server:8000/sse"
      TSFM_MCP_SERVER_URL: "http://tsfm-mcp-server:8000/sse"
      FMSR_MCP_SERVER_URL: "http://fmsr-mcp-server:8000/sse"
      IOT_MCP_SERVER_URL: "http://iot-mcp-server:8000/sse"
      VIBRATION_MCP_SERVER_URL: "http://vibration-mcp-server:8000/sse"
    ports:
      - "${TINY_AGENT_PORT:-8300}:8300"
    depends_on:
      thingsboard-mcp:
        condition: service_healthy
      tb-quarkus:
        condition: service_healthy
      wo-mcp-server:
        condition: service_healthy
      iot-mcp-server:
        condition: service_healthy
      vibration-mcp-server:
        condition: service_healthy
      fmsr-mcp-server:
        condition: service_healthy
      tsfm-mcp-server:
        condition: service_healthy
      # ollama:
      #   condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M


  # ── AssetOpsBench CouchDB (shared by wo, iot, vibration servers) ────────
  aob-couchdb:
    image: couchdb:3.5
    restart: unless-stopped
    environment:
      COUCHDB_USERNAME: admin
      COUCHDB_PASSWORD: password
      IOT_DBNAME: iot
      WO_DBNAME: workorder
      VIBRATION_DBNAME: vibration
    ports:
      - "${AOB_COUCHDB_PORT:-5985}:5984"
    volumes:
      - aob-couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: load default scenario data into CouchDB
  aob-couchdb-init:
    image: couchdb:3.5
    depends_on:
      aob-couchdb:
        condition: service_healthy
    environment:
      COUCHDB_URL: "http://aob-couchdb:5984"
      COUCHDB_USERNAME: admin
      COUCHDB_PASSWORD: password
    volumes:
      - ./assetopsbench/src/couchdb:/couchdb:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apt-get update -qq && apt-get install -y -qq python3 python3-pip > /dev/null 2>&1
        pip3 install -q --break-system-packages requests pandas python-dotenv couchdb3 > /dev/null 2>&1
        python3 /couchdb/init_data.py
        echo '✅ CouchDB data loaded'
    restart: "no"

  # ── AssetOpsBench MCP Servers ───────────────────────────────────────────
  wo-mcp-server:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile.assetopsbench-mcp-servers
    restart: unless-stopped
    command: ["wo"]
    environment:
      COUCHDB_URL: "http://aob-couchdb:5984"
      COUCHDB_USERNAME: admin
      COUCHDB_PASSWORD: password
      WO_DBNAME: workorder
      PORT: "8000"
    ports:
      - "${WO_MCP_PORT:-8203}:8000"
    depends_on:
      aob-couchdb:
        condition: service_healthy
      aob-couchdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  iot-mcp-server:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile.assetopsbench-mcp-servers
    restart: unless-stopped
    command: ["iot"]
    environment:
      COUCHDB_URL: "http://aob-couchdb:5984"
      COUCHDB_USERNAME: admin
      COUCHDB_PASSWORD: password
      IOT_DBNAME: iot
      ASSET_DBNAME: asset
      PORT: "8000"
    ports:
      - "${IOT_MCP_PORT:-8204}:8000"
    depends_on:
      aob-couchdb:
        condition: service_healthy
      aob-couchdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  vibration-mcp-server:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile.assetopsbench-mcp-servers
    restart: unless-stopped
    command: ["vibration"]
    environment:
      COUCHDB_URL: "http://aob-couchdb:5984"
      COUCHDB_USERNAME: admin
      COUCHDB_PASSWORD: password
      VIBRATION_DBNAME: vibration
      PORT: "8000"
    ports:
      - "${VIBRATION_MCP_PORT:-8205}:8000"
    depends_on:
      aob-couchdb:
        condition: service_healthy
      aob-couchdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  fmsr-mcp-server:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile.assetopsbench-mcp-servers
    restart: unless-stopped
    command: ["fmsr"]
    environment:
      PORT: "8000"
      FMSR_MODEL_ID: "${FMSR_MODEL_ID:-}"
      LITELLM_API_KEY: "${LITELLM_API_KEY:-}"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-}"
    ports:
      - "${FMSR_MCP_PORT:-8206}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  tsfm-mcp-server:
    build:
      context: ..
      dockerfile: docker-compose/Dockerfile.assetopsbench-mcp-servers
    restart: unless-stopped
    command: ["tsfm"]
    environment:
      PORT: "8000"
      PATH_TO_MODELS_DIR: "${PATH_TO_MODELS_DIR:-/tmp/models}"
      PATH_TO_DATASETS_DIR: "${PATH_TO_DATASETS_DIR:-/tmp/datasets}"
      PATH_TO_OUTPUTS_DIR: "${PATH_TO_OUTPUTS_DIR:-/tmp/outputs}"
    ports:
      - "${TSFM_MCP_PORT:-8207}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/mcp || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  pandas-mcp:
    build:
      context: ./pandas-mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "8000"
      PANDAS_MCP_LOG_LEVEL: "${PANDAS_MCP_LOG_LEVEL:-INFO}"
    ports:
      - "${PANDAS_MCP_PORT:-8202}:8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  aob-couchdb-data:
