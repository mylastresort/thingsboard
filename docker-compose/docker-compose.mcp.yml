services:
  thingsboard-mcp:
    image: thingsboard/mcp
    restart: unless-stopped
    environment:
      THINGSBOARD_URL: "http://thingsboard:8080"
 
      # ── authentication ───────────────────────────────────────────────────
      # API key takes priority when the image is started; leave blank to use
      # username/password instead.
      THINGSBOARD_API_KEY:     "${TB_MCP_API_KEY:-}"
      THINGSBOARD_USERNAME:    "${TB_MCP_USERNAME:-tenant@thingsboard.org}"
      THINGSBOARD_PASSWORD:    "${TB_MCP_PASSWORD:-tenant}"
 
      # ── transport: SSE HTTP service (not a STDIO subprocess) ─────────────
      SPRING_AI_MCP_SERVER_STDIO:   "false"
      SPRING_WEB_APPLICATION_TYPE:  servlet
      HTTP_BIND_ADDRESS:            "0.0.0.0"
      HTTP_BIND_PORT:               "8000"
 
    ports:
      - "${MCP_PORT:-8201}:8000"
 
    depends_on:
      - thingsboard
  
  ollama:
    image: ollama/ollama:0.30.11
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 5 &&
       ollama pull deepseek-r1:7b &&
       wait"

volumes:
  ollama_data: