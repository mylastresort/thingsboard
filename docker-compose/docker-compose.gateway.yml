services:
  proxy:
    image: haproxy:2.9-alpine
    environment:
      QUARKUS_BACKEND_HOST: ${QUARKUS_BACKEND_HOST:-tb-quarkus}
      QUARKUS_BACKEND_HOST_DEV: ${QUARKUS_BACKEND_HOST_DEV:-tb-quarkus-dev}
    ports:
      # - "8088:80"      # no longer needs browser access, but harmless to keep mapped for curl/debugging
      - "9999:9999"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      thingsboard:
        condition: service_healthy
      tb-quarkus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  tb-quarkus:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ${TB_QUARKUS_DOCKERFILE:-tb-quarkus/gateway/src/main/docker/Dockerfile.jvm}
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}?currentSchema=tb_quarkus
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - TB_URL=http://thingsboard:8080
      - TB_USERNAME=${TB_USERNAME:-tenant@thingsboard.org}
      - TB_PASSWORD=${TB_PASSWORD:-tenant}
      - PDM_SEED_DATA=${PDM_SEED_DATA:-/data}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - QUARKUS_REDIS_HOSTS=redis://redis:6379
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-true}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    volumes:
      - ./tb-quarkus-cache:/deployments/cache
      - ./application/src/main/resources/predictive-maintenance/data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8083:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/q/openapi >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
