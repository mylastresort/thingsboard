services:
  gateway:
    image: haproxy:2.9-alpine
    container_name: tb-lts43-monolith-gateway
    ports:
      # - "8088:80"      # no longer needs browser access, but harmless to keep mapped for curl/debugging
      - "9999:9999"
    volumes:
      - ./gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      thingsboard:
        condition: service_healthy
      model:
        condition: service_healthy
      # tb-quarkus:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  tb-quarkus:
    build:
      context: ./tb-quarkus/gateway
      dockerfile: ${TB_QUARKUS_DOCKERFILE:-src/main/docker/Dockerfile.jvm}
    container_name: tb-lts43-monolith-tb-quarkus
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-thingsboard}?currentSchema=tb_quarkus
      - QUARKUS_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - QUARKUS_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./tb-quarkus-cache:/deployments/cache
    depends_on:
      postgres:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
    ports:
      - "8083:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/q/openapi >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

