services:
  config-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: config_user
      POSTGRES_PASSWORD: config_pass
      POSTGRES_DB: config_db
    ports:
      - "5432"
    volumes:
      - ./psql_data-merge-config:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d config_db -U config_user"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  config-api:
    build:
      context: ./config-api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9000:9000"
    depends_on:
      config-db:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://config_user:config_pass@config-db:5432/config_db
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s