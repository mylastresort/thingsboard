services:
  pdm-forecast-worker:
    restart: unless-stopped
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    volumes:
      - .:/app
      - ./pip-cache:/root/.cache/pip
      - ./models-cache:/models
    depends_on:
      tb-quarkus:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PDM_PROCESS_ROLE=worker
      - PDM_WORKER_MODEL_TYPE=FORECAST
      - PDM_WORKER_GROUP=pdm-python-forecast-workers
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - REDIS_URL=redis://redis:6379/0
      - QUARKUS_API_URL=http://tb-quarkus:8081/api/v1
      - TB_HOST=${TB_HOST:-http://thingsboard:8080}
      - TB_USERNAME=${TB_USERNAME:-tenant@thingsboard.org}
      - TB_PASSWORD=${TB_PASSWORD:-tenant}
      - MODELS_PATH=/models
      - PDM_AVRO_SCHEMA_DIR=/app/tb-quarkus/gateway/src/main/avro
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  pdm-anomaly-worker:
    restart: unless-stopped
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    volumes:
      - .:/app
      - ./pip-cache:/root/.cache/pip
      - ./models-cache:/models
    depends_on:
      tb-quarkus:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PDM_PROCESS_ROLE=worker
      - PDM_WORKER_MODEL_TYPE=ANOMALY
      - PDM_WORKER_GROUP=pdm-python-anomaly-workers
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - REDIS_URL=redis://redis:6379/0
      - QUARKUS_API_URL=http://tb-quarkus:8081/api/v1
      - TB_HOST=${TB_HOST:-http://thingsboard:8080}
      - TB_USERNAME=${TB_USERNAME:-tenant@thingsboard.org}
      - TB_PASSWORD=${TB_PASSWORD:-tenant}
      - MODELS_PATH=/models
      - PDM_AVRO_SCHEMA_DIR=/app/tb-quarkus/gateway/src/main/avro
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
