services:
  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  pdm-model-store:
    restart: unless-stopped
    build:
      context: ./predictive-maintenance/service
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - PDM_AVRO_SCHEMA_DIR=/app/tb-quarkus/gateway/src/main/avro
      - PDM_STORAGE_COMMAND_TOPIC=pdm-storage-commands
      - PDM_STORAGE_RESPONSE_TOPIC=pdm-storage-responses
      - PDM_STORAGE_GROUP=pdm-model-store-workers
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-pdm-models}
      - MODEL_STORAGE_PG_DSN=${MODEL_STORAGE_PG_DSN:-postgresql://postgres:postgres@postgres:5432/thingsboard}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./tb-quarkus/gateway/src/main/avro:/app/tb-quarkus/gateway/src/main/avro:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from confluent_kafka import Producer; Producer({'bootstrap.servers':'kafka:9092'}).list_topics(timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      replicas: ${PDM_MODEL_STORE_REPLICAS:-2}

  pdm-forecast-worker:
    restart: unless-stopped
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    volumes:
      - .:/app
      - ./pip-cache:/root/.cache/pip
      - ./models-cache:/models
    depends_on:
      tb-quarkus:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pdm-model-store:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PDM_PROCESS_ROLE=worker
      - PDM_WORKER_MODEL_TYPE=FORECAST
      - PDM_WORKER_GROUP=pdm-python-forecast-workers
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - REDIS_URL=redis://redis:6379/0
      - QUARKUS_API_URL=http://tb-quarkus:8081/api/v1
      - TB_HOST=${TB_HOST:-http://thingsboard:8080}
      - TB_USERNAME=${TB_USERNAME:-tenant@thingsboard.org}
      - TB_PASSWORD=${TB_PASSWORD:-tenant}
      - MODELS_PATH=/models
      - PDM_STORAGE_COMMAND_TOPIC=pdm-storage-commands
      - PDM_STORAGE_RESPONSE_TOPIC=pdm-storage-responses
      - PDM_AVRO_SCHEMA_DIR=/app/tb-quarkus/gateway/src/main/avro
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  pdm-anomaly-worker:
    restart: unless-stopped
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    volumes:
      - .:/app
      - ./pip-cache:/root/.cache/pip
      - ./models-cache:/models
    depends_on:
      tb-quarkus:
        condition: service_healthy
      thingsboard:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      pdm-model-store:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PDM_PROCESS_ROLE=worker
      - PDM_WORKER_MODEL_TYPE=ANOMALY
      - PDM_WORKER_GROUP=pdm-python-anomaly-workers
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - REDIS_URL=redis://redis:6379/0
      - QUARKUS_API_URL=http://tb-quarkus:8081/api/v1
      - TB_HOST=${TB_HOST:-http://thingsboard:8080}
      - TB_USERNAME=${TB_USERNAME:-tenant@thingsboard.org}
      - TB_PASSWORD=${TB_PASSWORD:-tenant}
      - MODELS_PATH=/models
      - PDM_STORAGE_COMMAND_TOPIC=pdm-storage-commands
      - PDM_STORAGE_RESPONSE_TOPIC=pdm-storage-responses
      - PDM_AVRO_SCHEMA_DIR=/app/tb-quarkus/gateway/src/main/avro
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis; redis.Redis.from_url('redis://redis:6379/0').ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
