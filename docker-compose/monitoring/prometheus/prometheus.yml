global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'thingsboard-stack'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  # ── ThingsBoard upstream (monolith) ──────────────────────────────────────────
  - job_name: 'thingsboard'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['thingsboard:8080']

  # ── tb-quarkus gateway ──────────────────────────────────────────────────────
  - job_name: 'tb-quarkus'
    metrics_path: /metrics
    static_configs:
      - targets: ['tb-quarkus:8081']

  # ── PdM workers (prometheus_client on :8100 / :8101) ───────────────────────
  - job_name: 'pdm-forecast-workers'
    metrics_path: /metrics
    static_configs:
      - targets: ['pdm-forecast-worker:8100']

  - job_name: 'pdm-anomaly-workers'
    metrics_path: /metrics
    static_configs:
      - targets: ['pdm-anomaly-worker:8101']

  # ── AI agent ────────────────────────────────────────────────────────────────
  - job_name: 'ai-agent'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-agent-py:8300']

  # ── MCP server ──────────────────────────────────────────────────────────────
  - job_name: 'thingsboard-mcp'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['thingsboard-mcp:8000']

  # ── OTel Collector (self-scrape) ────────────────────────────────────────────
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['localhost:8888']
