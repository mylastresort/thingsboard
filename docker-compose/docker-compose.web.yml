services:
  tb-web-ui:
    build:
      context: . # ← repo root
      dockerfile: msa/web-ui/Dockerfile
    container_name: tb-lts43-monolith-tb-web-ui
    ports:
      - "8090:8090"
    environment:
      - TB_ENABLE_PROXY=true
      - TB_HOST=gateway
      - TB_PORT=80
      - HTTP_BIND_ADDRESS=0.0.0.0
      - HTTP_BIND_PORT=8090
    depends_on:
      thingsboard:
        condition: service_started
    restart: unless-stopped

  assetops-client:
    build:
      context: ./assetopsbench/assetops-client
      dockerfile: Dockerfile
    container_name: assetops-client
    restart: unless-stopped
    environment:
      # ASSETOPS_PROJECT_ROOT: ${ASSETOPS_PROJECT_ROOT:-${PWD}/assetopsbench}
      OLLAMA_HOST: http://host.docker.internal:21434
      LITELLM_BASE_URL: http://host.docker.internal:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-local}
      # COUCHDB_URL: http://host.docker.internal:5984
      TINY_AGENT_URL: ${TINY_AGENT_URL:-http://ai-agent:8300}
      # UV_CACHE_DIR: /root/.cache/uv
      # UV_LINK_MODE: copy
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    ports:
      - "4174:4174"
    # volumes:
    #   - "${ASSETOPS_PROJECT_ROOT:-${PWD}../assetopsbench}:${ASSETOPS_PROJECT_ROOT:-${PWD}/assetopsbench}"
    #   - /var/run/docker.sock:/var/run/docker.sock
    #   - assetops-client-uv-cache:/root/.cache/uv

