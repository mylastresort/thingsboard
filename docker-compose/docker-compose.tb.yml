services:
  # Optional on a single node — see note above. Kept for forward-compat
  # if you add a second tb-node later; drop it and unset CACHE_TYPE if not.
  redis:
    image: "redis:7.2-alpine"
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Single-node KRaft mode — no Zookeeper needed.
  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Required overrides for a 1-broker cluster — Kafka defaults these to 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # CLUSTER_ID intentionally omitted — a single-broker node doesn't need one set explicitly; the image generates and logs one on first boot 
    volumes:
      - ./kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    restart: unless-stopped
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pdm-commands --partitions 1 --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pdm-events --partitions ${PDM_KAFKA_PARTITIONS:-16} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pdm-job-state --partitions ${PDM_KAFKA_PARTITIONS:-16} --replication-factor 1 --config cleanup.policy=compact &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pdm-storage-commands --partitions ${PDM_KAFKA_PARTITIONS:-16} --replication-factor 1 &&
       /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic pdm-storage-responses --partitions ${PDM_KAFKA_PARTITIONS:-16} --replication-factor 1"
    restart: "no"

  # Optional time-series backend — only created when the "cassandra" profile
  # is active. Activate it by setting COMPOSE_PROFILES=cassandra in .env
  # alongside DATABASE_TS_TYPE=cassandra (see note on thingsboard's env below;
  # Compose can't branch a service's existence on another service's env var,
  # so the two toggles have to be kept in sync manually).
  cassandra:
    image: cassandra:4.1
    restart: unless-stopped
    profiles: ["cassandra"]
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: thingsboard
      CASSANDRA_DC: datacenter1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Single-node dev/staging ring. For real HA you need >=3 nodes and RF=3 —
      # see the reliability note in the accompanying review.
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP_SIZE:-2G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-512M}
    volumes:
      - ./cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 90s

  thingsboard:
    # restart: always
    image: "${DOCKER_REPO:-thingsboard}/${TB_NODE_DOCKER_NAME:-tb-node}:${TB_VERSION:-4.3.1.3}"
    volumes:
      - ./tb-config:/config
    ports:
      - "8080:8080"
      - "7071:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Cache — remove these 3 lines to fall back to Caffeine
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # Queue — was in-memory
      TB_QUEUE_TYPE: kafka
      TB_KAFKA_SERVERS: kafka:9092

      # Time-series backend — "sql" keeps everything in Postgres (default);
      # set DATABASE_TS_TYPE=cassandra in .env (and enable the cassandra
      # profile, see above) to switch time-series writes to Cassandra.
      # Entities, attributes, relations, alarms, and events always stay
      # in Postgres regardless of this setting.
      DATABASE_TS_TYPE: ${DATABASE_TS_TYPE:-sql}
      DATABASE_TS_LATEST_TYPE: ${DATABASE_TS_LATEST_TYPE:-sql}
      CASSANDRA_URL: cassandra:9042
      CASSANDRA_LOCAL_DATACENTER: datacenter1

      PDM_WS_URL: ws://tb-quarkus:8081/models/ws/unified
      LOGGING_LEVEL_ORG_THINGSBOARD: INFO
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_CONTROLLER: DEBUG
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_TRANSPORT: DEBUG
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_SERVICE_QUEUE: WARN
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_ACTORS_SERVICE: WARN
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_ACTORS_RULECHAIN: WARN
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      # Optional: only waited on when the "cassandra" profile is active.
      # required: false means this is silently skipped (no error) when
      # DATABASE_TS_TYPE=sql and the cassandra profile isn't enabled.
      # Requires Compose v2.20.2+.
      cassandra:
        condition: service_healthy
        required: false
    env_file:
      - .env
