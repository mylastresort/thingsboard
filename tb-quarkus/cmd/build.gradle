plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-picocli'
    implementation 'io.quarkus:quarkus-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest-client-reactive-jackson'
    implementation 'io.quarkiverse.openapi.generator:quarkus-openapi-generator:2.17.0'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'org.tb.quarkus'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

// Resolve the OpenAPI split source: host path or Docker COPY location.
def openApiSource = file("$projectDir/../../api-specs/openapi")
if (!openApiSource.exists()) {
    openApiSource = file("$projectDir/openapi-source")
}

tasks.register('bundleOpenApi', Exec) {
    group = 'openapi tools'
    description = 'Bundle split OpenAPI spec into a single file for code generation.'
    inputs.dir openApiSource
    outputs.file "$projectDir/openapi.yaml"
    commandLine 'npx', '--yes', '@redocly/cli', 'bundle',
        "${openApiSource}/openapi.yaml",
        '--output', "$projectDir/openapi.yaml",
        '--ext', 'yaml'
}

// Sync the gateway's OpenAPI spec into src/main/openapi, where the
// quarkus-openapi-generator extension picks it up automatically as
// part of quarkusGenerateCode. See application.properties for the
// generator config (package names, mutiny, configKey, etc).
tasks.register('syncOpenApiSpec', Copy) {
    group = 'openapi tools'
    description = 'Copy the bundled OpenAPI spec into src/main/openapi for code generation.'
    dependsOn 'bundleOpenApi'
    from "$projectDir/openapi.yaml"
    into "$projectDir/src/main/openapi"
}

tasks.named('quarkusGenerateCode') {
    dependsOn tasks.named('syncOpenApiSpec')
}

tasks.named('quarkusGenerateCodeDev') {
    dependsOn tasks.named('syncOpenApiSpec')
}

// CLI app - no HTTP server needed, the packaged jar just runs the
// picocli @TopCommand and exits. See src/main/resources/application.properties
// for quarkus.package.jar.type=uber-jar (so `java -jar` works standalone).
test {
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
}
