mp.openapi.scan.disable=true
quarkus.http.port=8081
quarkus.swagger-ui.always-include=true

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:57606/thingsboard?currentSchema=tb_quarkus}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}

# ==============================================================================
# DEV / TEST DATASOURCE
# currentSchema=tb_quarkus sets the connection-level default schema —
# anything unscoped (raw SQL, stray queries) resolves here, not against
# ThingsBoard's `public` schema.
# ==============================================================================
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:57606/thingsboard?currentSchema=tb_quarkus
%test.quarkus.datasource.username=postgres
%test.quarkus.datasource.password=postgres

%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:57606/thingsboard?currentSchema=tb_quarkus
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres

# ==============================================================================
# DEFAULT PERSISTENCE UNIT — tb_quarkus schema
# This is the main tb-quarkus service's own schema.
# ==============================================================================
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.database.default-schema=tb_quarkus
quarkus.hibernate-orm.packages=org.tb.quarkus.entity.core

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=tb_quarkus
quarkus.flyway.default-schema=tb_quarkus
quarkus.flyway.locations=db/migration/tb_quarkus
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1
quarkus.flyway.baseline-description=existing_schema
quarkus.flyway.clean-disabled=true
quarkus.flyway.create-schemas=true

# ==============================================================================
# NAMED PERSISTENCE UNIT — "pdm" (tb-quarkus-pdm submodule)
# Own schema, own migration folder, own Flyway history table.
# Same datasource/connection pool as default (no `.datasource=` override needed
# unless this submodule later moves to its own physical database).
# ==============================================================================
quarkus.hibernate-orm."pdm".packages=org.tb.quarkus.entity.pdm
quarkus.hibernate-orm."pdm".database.default-schema=tb_quarkus_pdm
quarkus.hibernate-orm."pdm".datasource=<default>

quarkus.flyway."pdm".migrate-at-start=true
quarkus.flyway."pdm".schemas=tb_quarkus_pdm
quarkus.flyway."pdm".locations=db/migration/pdm
quarkus.flyway."pdm".baseline-on-migrate=true
quarkus.flyway."pdm".baseline-version=1
quarkus.flyway."pdm".baseline-description=pdm_initial
quarkus.flyway."pdm".clean-disabled=true
quarkus.flyway."pdm".create-schemas=true

quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.hibernate-orm."pdm".physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy