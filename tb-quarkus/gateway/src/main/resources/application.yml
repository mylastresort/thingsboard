mp:
  openapi:
    scan:
      disable: true

quarkus:
  http:
    port: 8081
  swagger-ui:
    always-include: true

  hibernate-orm:
    schema-management:
      strategy: validate
    mapping:
      format:
        global: ignore
    # ==========================================================================
    # DEFAULT PERSISTENCE UNIT — tb_quarkus schema
    # This is the main tb-quarkus service's own schema.
    # ==========================================================================
    database:
      default-schema: tb_quarkus
    packages: org.tb.quarkus.entity.core
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    # ==========================================================================
    # NAMED PERSISTENCE UNIT — "pdm" (tb-quarkus-pdm submodule)
    # Own schema, own migration folder, own Flyway history table.
    # Same datasource/connection pool as default.
    # ==========================================================================
    "pdm":
      packages: org.tb.quarkus.entity.pdm
      database:
        default-schema: tb_quarkus_pdm
      datasource: "<default>"
      physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

    # ==========================================================================
    # NAMED PERSISTENCE UNIT — "agentic-benchmark" (AssetOpsBench/Hugging Face rows)
    # ==========================================================================
    "agentic-benchmark":
      packages: org.tb.quarkus.entity.agenticbenchmark
      database:
        default-schema: tb_quarkus_agentic_benchmark
      datasource: "<default>"
      physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  datasource:
    db-kind: postgresql
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5431/thingsboard?currentSchema=tb_quarkus}
    username: ${QUARKUS_DATASOURCE_USERNAME:postgres}
    password: ${QUARKUS_DATASOURCE_PASSWORD:postgres}

  flyway:
    migrate-at-start: true
    default-schema: tb_quarkus
    locations: db/migration/tb_quarkus
    baseline-on-migrate: true
    baseline-version: "1"
    baseline-description: existing_schema
    clean-disabled: true
    create-schemas: true
    schemas:
      - tb_quarkus
      - tb_quarkus_pdm
      - tb_quarkus_agentic_benchmark

    "pdm":
      migrate-at-start: true
      schemas: tb_quarkus_pdm
      locations: db/migration/pdm
      baseline-on-migrate: true
      baseline-version: "1"
      baseline-description: pdm_initial
      clean-disabled: true
      create-schemas: true

    # Flyway instances are tied to datasources, not Hibernate persistence units.
    # This service uses the default datasource for the agentic-benchmark unit, so
    # its DDL is versioned in db/migration/tb_quarkus.
    "agentic-benchmark":
      migrate-at-start: true
      schemas: tb_quarkus_agentic_benchmark
      locations: db/migration/agentic_benchmark
      baseline-on-migrate: true
      baseline-version: "2"
      baseline-description: agentic_benchmark_initial
      clean-disabled: true
      create-schemas: true

  kafka:
    devservices:
      enabled: false

kafka:
  bootstrap:
    servers: kafka:9092

assetopsbench:
  path: ${ASSETOPSBENCH_PATH:}

agents:
  tb:
    url: ${TB_URL:http://thingsboard:8080}
    username: ${TB_USERNAME:tenant@thingsboard.org}
    password: ${TB_PASSWORD:tenant}

pdm:
  seed:
    data: ${PDM_SEED_DATA:/data}

# ==============================================================================
# DEV / TEST DATASOURCE
# currentSchema=tb_quarkus sets the connection-level default schema —
# anything unscoped (raw SQL, stray queries) resolves here, not against
# ThingsBoard's `public` schema.
# ==============================================================================
"%test":
  quarkus:
    datasource:
      devservices:
        enabled: false
      db-kind: postgresql
      jdbc:
        url: jdbc:postgresql://localhost:5431/thingsboard?currentSchema=tb_quarkus
      username: postgres
      password: postgres

"%dev":
  quarkus:
    datasource:
      devservices:
        enabled: false
      db-kind: postgresql
      jdbc:
        url: jdbc:postgresql://localhost:5431/thingsboard?currentSchema=tb_quarkus
      username: postgres
      password: postgres
