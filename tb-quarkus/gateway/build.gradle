plugins {
    id 'java'
    id 'io.quarkus'
    id 'org.openapi.generator' version '7.8.0'
    id 'com.github.imflog.kafka-schema-registry-gradle-plugin' version '2.1.1'
}

repositories {
    mavenCentral()
    mavenLocal()
    maven { url 'https://packages.confluent.io/maven/' }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.quarkiverse.io/quarkus3x/extensions/' }
}

dependencies {
    implementation 'io.quarkiverse.mcp:quarkus-mcp-server-http'
    implementation enforcedPlatform("${quarkusPlatformGroupId}:quarkus-mcp-server-bom:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-messaging-kafka'
    implementation 'io.quarkus:quarkus-redis-client'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.rest-assured:rest-assured'

    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'io.quarkiverse.groovy:quarkus-groovy:3.37.3'

    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.quarkus:quarkus-avro'
    implementation 'org.apache.avro:avro:1.11.3'
    implementation 'io.quarkus:quarkus-confluent-registry-avro'
    implementation 'io.confluent:kafka-avro-serializer:7.7.1'
}

group = 'org.tb-quarkus.dev'
version = '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

tasks.register('bundleOpenApi', Exec) {
    group = 'openapi tools'
    description = 'Bundle split OpenAPI spec from api-specs/openapi/ into a single file for code generation.'
    inputs.dir "$projectDir/../../api-specs/openapi"
    outputs.file "$buildDir/openapi/openapi.yaml"
    doFirst { file("$buildDir/openapi").mkdirs() }
    commandLine 'npx', '--yes', '@redocly/cli', 'bundle',
        "$projectDir/../../api-specs/openapi/openapi.yaml",
        '--output', "$buildDir/openapi/openapi.yaml",
        '--ext', 'yaml'
}

openApiGenerate {
    generatorName = "jaxrs-spec"
    inputSpec = "$buildDir/openapi/openapi.yaml"
    outputDir = "$buildDir/openapi-generated"
    apiPackage = "org.tb.quarkus.api"
    modelPackage = "org.tb.quarkus.model"
    configOptions = [
        interfaceOnly: "true",
        useSwaggerAnnotations: "false",
        useJakartaEe: "true"
    ]
}

tasks.named('openApiGenerate') {
    dependsOn 'bundleOpenApi'
}

tasks.register('generatePythonApiClient', org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    dependsOn 'bundleOpenApi'
    generatorName = "python"
    inputSpec = "$buildDir/openapi/openapi.yaml"
    outputDir = "$projectDir/../../predictive-maintenance"
    packageName = "quarkus_api_client"
    additionalProperties = [
        generateSourceCodeOnly: "true",
        packageVersion: "0.1.0"
    ]
}

tasks.register('copyOpenApiSpec', Copy) {
    dependsOn 'bundleOpenApi'
    from "$buildDir/openapi/openapi.yaml"
    into "$buildDir/generated/openapi/META-INF"
}

processResources {
    dependsOn copyOpenApiSpec
    exclude "META-INF/openapi.yaml"
    from("$buildDir/generated/openapi/META-INF") {
        into "META-INF"
    }
}

tasks.register('copyAvroSchemas', Copy) {
    from "$projectDir/src/main/avro"
    into "$buildDir/resources/main/avro"
}

processResources.dependsOn copyAvroSchemas

compileJava.dependsOn tasks.openApiGenerate

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/openapi-generated/src/gen/java"
            srcDirs += "$buildDir/asyncapi-generated/src/gen/java"   // add alongside existing openapi srcDir
        }
    }
}

tasks.register('bundleAsyncApi', Exec) {
    def splitSpec = "$projectDir/../../api-specs/asyncapi/asyncapi.yaml"
    def bundledOutput = "$projectDir/../../api-specs/asyncapi.yaml"
    def mergeScript = "$projectDir/../../api-specs/asyncapi/merge-asyncapi.js"

    inputs.file splitSpec
    inputs.file mergeScript
    outputs.file bundledOutput

    workingDir = projectDir
    commandLine 'node', mergeScript, splitSpec, bundledOutput
}

tasks.register('generateAsyncApiModels', Exec) {
    def specFile = "$projectDir/../../api-specs/asyncapi.yaml"
    def outDir = "$buildDir/asyncapi-generated/src/gen/java"

    dependsOn tasks.bundleAsyncApi
    inputs.file specFile
    outputs.dir outDir
    doFirst { file(outDir).mkdirs() }

    workingDir = projectDir
    commandLine 'npx', '--yes', '@asyncapi/modelina-cli', 'generate', 'java',
        specFile,
        '--packageName=org.tb.quarkus.event.model',
        "-o", outDir,
        '--javaJackson',
        '--javaIncludeComments',
        '--javaArrayType=List'
}

compileJava.dependsOn tasks.generateAsyncApiModels

schemaRegistry {
    url = "${findProperty('schemaRegistryUrl') ?: 'http://localhost:8081'}"
    compatibility {
        subject('pdm-commands-value', 'src/main/avro/pdm-commands-value.avsc', 'BACKWARD')
        subject('pdm-events-value', 'src/main/avro/pdm-events-value.avsc', 'BACKWARD')
        subject('pdm-job-state-value', 'src/main/avro/pdm-job-state-value.avsc', 'FULL')
    }
}

if (providers.gradleProperty('schemaRegistryCompatibilityCheck').map { it.toBoolean() }.getOrElse(false)) {
    check.dependsOn testSchemasCompatibility
}
