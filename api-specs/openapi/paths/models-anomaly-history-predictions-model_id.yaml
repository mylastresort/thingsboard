delete:
  operationId: deleteAnomalyHistoryPredictions
  summary: Delete anomaly history predictions
  parameters:
    - name: model_id
      in: path
      required: true
      schema:
        type: string
    - name: predictionType
      in: query
      schema:
        type: string
  responses:
    "200":
      description: Deleted prediction count
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "500":
      $ref: "../responses/_index.yaml#/Error"
