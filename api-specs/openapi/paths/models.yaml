get:
  operationId: getPredictiveModelsByPage
  summary: List predictive model configs with pagination
  parameters:
    - $ref: "../parameters/_index.yaml#/PageSize"
    - $ref: "../parameters/_index.yaml#/Page"
    - $ref: "../parameters/_index.yaml#/SortProperty"
    - $ref: "../parameters/_index.yaml#/SortOrder"
    - $ref: "../parameters/_index.yaml#/TextSearch"
  responses:
    "200":
      description: Predictive model config page
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "500":
      $ref: "../responses/_index.yaml#/Error"
post:
  operationId: createPredictiveModel
  summary: Create a predictive model config
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    "200":
      description: Created predictive model config
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "400":
      $ref: "../responses/_index.yaml#/Error"
    "500":
      $ref: "../responses/_index.yaml#/Error"
