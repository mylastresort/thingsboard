get:
  operationId: getPredictiveModelsByPage
  summary: List forecast configs with pagination
  parameters:
    - $ref: "../parameters/_index.yaml#/PageSize"
    - $ref: "../parameters/_index.yaml#/Page"
    - $ref: "../parameters/_index.yaml#/SortProperty"
    - $ref: "../parameters/_index.yaml#/SortOrder"
    - $ref: "../parameters/_index.yaml#/TextSearch"
  responses:
    "200":
      description: Forecast config page
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "500":
      $ref: "../responses/_index.yaml#/Error"
post:
  operationId: createForecast
  summary: Create a forecast config
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    "200":
      description: Created forecast config
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "400":
      $ref: "../responses/_index.yaml#/Error"
    "500":
      $ref: "../responses/_index.yaml#/Error"
