get:
  operationId: getPredictiveModelById
  summary: Get predictive model config by id
  parameters:
    - $ref: "../parameters/_index.yaml#/PredictiveModelId"
  responses:
    "200":
      description: Predictive model config
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "404":
      $ref: "../responses/_index.yaml#/Error"
    "500":
      $ref: "../responses/_index.yaml#/Error"
post:
  operationId: updatePredictiveModelById
  summary: Update a predictive model config
  parameters:
    - $ref: "../parameters/_index.yaml#/PredictiveModelId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: true
  responses:
    "200":
      description: Updated predictive model config
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "404":
      $ref: "../responses/_index.yaml#/Error"
    "500":
      $ref: "../responses/_index.yaml#/Error"
delete:
  operationId: deletePredictiveModelById
  summary: Delete a predictive model config
  parameters:
    - $ref: "../parameters/_index.yaml#/PredictiveModelId"
  responses:
    "200":
      description: Delete result
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    "404":
      $ref: "../responses/_index.yaml#/Error"
    "500":
      $ref: "../responses/_index.yaml#/Error"
