  /models/failure-mode-records/import:
    $ref: "./paths/models-failure-mode-records-import.yaml"
  /agentic-benchmark/subsets:
    $ref: "./paths/agentic-benchmark-subsets.yaml"
  /agentic-benchmark/rows:
    $ref: "./paths/agentic-benchmark-rows.yaml"
  /agentic-benchmark/rows/upsert-batch:
    $ref: "./paths/agentic-benchmark-rows-upsert-batch.yaml"
