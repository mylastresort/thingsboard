openapi: 3.0.3
info:
  title: Quarkus PdM API
  version: 0.1.0
  description: |
    This API provides endpoints for managing failure mode history and records. The API is designed to facilitate predictive maintenance by providing insights into device failures and maintenance history.
servers:
  - url: /api/v1
paths:
  /models/available:
    $ref: "./paths/models-available.yaml"
  /models/saveLoadConfig:
    $ref: "./paths/models-saveLoadConfig.yaml"
  /models/loadModelConfig:
    $ref: "./paths/models-loadModelConfig.yaml"
  /models/anomaly-history-predictions/{model_id}/{prediction_type}:
    $ref: "./paths/models-anomaly-history-predictions-model_id-prediction_type.yaml"
  /models/anomaly-history-predictions/{model_id}:
    $ref: "./paths/models-anomaly-history-predictions-model_id.yaml"
  /models:
    $ref: "./paths/models.yaml"
  /models/seed-machine/options:
    $ref: "./paths/models-seed-machine-options.yaml"
  /models/seed-machine:
    $ref: "./paths/models-seed-machine.yaml"
  /models/{forecast_id}:
    $ref: "./paths/models-forecast_id.yaml"
  /models/{forecast_id}/status:
    $ref: "./paths/models-forecast_id-status.yaml"
  /models/device/{device_id}:
    $ref: "./paths/models-device-device_id.yaml"
  /models/failure-mode-history:
    $ref: "./paths/models-failure-mode-history.yaml"
  /models/failure-mode-history/{model_id}:
