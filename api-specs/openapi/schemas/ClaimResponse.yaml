type: object
required:
  - id
  - createdTime
  - name
  - done
properties:
  id:
    type: string
    format: uuid
  createdTime:
    type: integer
    format: int64
  name:
    type: string
  body:
    type: string
    nullable: true
  done:
    type: boolean
  assigneeId:
    type: string
    format: uuid
    nullable: true
  tags:
    type: object
    additionalProperties: true
    nullable: true
