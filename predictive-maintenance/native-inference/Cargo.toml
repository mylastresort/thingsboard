[package]
name = "pdm-native-inference"
version = "0.1.0"
edition = "2021"
description = "High-performance native inference engine for ThingsBoard predictive maintenance"

[dependencies]
# ONNX Runtime
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.16"

# Data / scientific computing
polars = { version = "0.46", features = ["rolling_window", "lazy", "json"] }

# Kafka (pure Rust, no cmake needed)
kafka = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
rand = "0.8"

[[bench]]
name = "inference_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
