<div class="fsm-root">

  <!-- ── TOP TOOLBAR ── -->
  <div class="fsm-toolbar">
    <mat-icon class="fsm-logo-icon">precision_manufacturing</mat-icon>
    <span class="fsm-logo-text">FlexSim Manager</span>
    <div class="fsm-sep"></div>
    <div class="fsm-health">
      <div id="healthDot" class="fsm-dot"></div>
      <span id="healthText">Connecting…</span>
    </div>
    <span class="fsm-grow"></span>
    <button id="syncBtn" class="fsm-tbtn">
      <mat-icon>sync</mat-icon><span>Sync Params</span>
    </button>
    <button id="refreshBtn" class="fsm-tbtn fsm-tbtn-icon" title="Refresh">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- ── MAIN BODY ── -->
  <div class="fsm-body">

    <!-- LEFT: models / simulations table -->
    <div class="fsm-panel fsm-left">
      <div class="fsm-bar">
        <span class="fsm-bar-title">Models &amp; Simulations</span>
        <div class="fsm-bar-actions">
          <button id="openBtn" class="fsm-ibtn" title="Open in FlexSim" disabled>
            <mat-icon>open_in_new</mat-icon>
          </button>
          <button id="closeBtn" class="fsm-ibtn fsm-ibtn-danger" title="Close model" disabled>
            <mat-icon>close</mat-icon>
          </button>
          <button id="addBtn" class="fsm-btn fsm-btn-primary">
            <mat-icon>add</mat-icon> Add
          </button>
        </div>
      </div>
      <div class="fsm-tbl-wrap">
        <table class="fsm-tbl">
          <thead>
            <tr>
              <th>Model</th>
              <th>Simulation</th>
              <th>Runs</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- RIGHT: results chart -->
    <div class="fsm-panel fsm-right">
      <div class="fsm-bar">
        <span id="detailTitle" class="fsm-bar-title">— Select a simulation —</span>
        <div class="fsm-bar-actions">
          <select id="runSel" class="fsm-sel" title="Run" style="display:none"></select>
          <select id="objSel" class="fsm-sel" title="Objective"></select>
          <button id="runBtn" class="fsm-btn fsm-btn-accent" disabled>
            <mat-icon>play_arrow</mat-icon> Run Job
          </button>
        </div>
      </div>
      <div class="fsm-chart-area" id="chartArea">
        <div id="emptyState" class="fsm-empty-state">
          <mat-icon>analytics</mat-icon>
          <p>Select a simulation to view results</p>
        </div>
        <div id="chartEl" class="fsm-chart" style="display:none"></div>
      </div>
      <div id="statusBar" class="fsm-status"></div>
    </div>

  </div><!-- /fsm-body -->

  <!-- ── ADD MODEL MODAL ── -->
  <div id="overlay" class="fsm-overlay" style="display:none">
    <div class="fsm-dialog">
      <div class="fsm-dialog-hd">Open FlexSim Model</div>
      <label class="fsm-dlabel">Select Model
        <select id="dlgSel" class="fsm-sel-wide"></select>
      </label>
      <div class="fsm-dialog-ft">
        <button id="dlgCancel" class="fsm-btn">Cancel</button>
        <button id="dlgOk" class="fsm-btn fsm-btn-primary">Open</button>
      </div>
    </div>
  </div>

</div>
