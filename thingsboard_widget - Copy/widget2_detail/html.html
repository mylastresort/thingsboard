<div class="fd-root">

  <!-- Top toolbar -->
  <div class="fd-bar">
    <button id="backBtn" class="fd-ibtn" title="Back to list">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="fd-breadcrumb">
      <span id="modelLabel" class="fd-bc-model">—</span>
      <mat-icon class="fd-bc-sep">chevron_right</mat-icon>
      <span id="simLabel" class="fd-bc-sim">—</span>
    </div>
    <span class="fd-grow"></span>
    <div class="fd-health">
      <span class="fd-status-label">Status: <span id="hTxt">…</span></span>
    </div>
    <div class="fd-bar-actions">
      <button id="openBtn" class="fd-tbtn" title="Open model in FlexSim desktop">
        <mat-icon>open_in_new</mat-icon>
        <span>Open in FlexSim</span>
      </button>
      <button id="exportBtn" class="fd-tbtn" title="Export results as CSV">
        <mat-icon>download</mat-icon>
        <span>Export CSV</span>
      </button>
      <button id="syncBtn" class="fd-tbtn" title="Sync dashboard telemetry → FlexSim parameters">
        <mat-icon>sync</mat-icon>
        <span>Sync Params</span>
      </button>
      <div class="fd-bar-divider"></div>
      <button id="settingsBtn" class="fd-ibtn" title="Widget settings">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
  </div>

  <!-- Controls bar -->
  <div class="fd-ctrl-bar">
    <label class="fd-ctrl-grp">
      <span class="fd-ctrl-label">Run</span>
      <select id="runSel" class="fd-sel"></select>
    </label>
    <label class="fd-ctrl-grp">
      <span class="fd-ctrl-label">Objective</span>
      <select id="objSel" class="fd-sel"></select>
    </label>
    <button id="refreshBtn" class="fd-ibtn" title="Refresh results">
      <mat-icon>refresh</mat-icon>
    </button>
    <span class="fd-grow"></span>
    <button id="runBtn" class="fd-btn fd-btn-run">
      <mat-icon>play_arrow</mat-icon>
      <span>Run Job</span>
    </button>
  </div>

  <!-- Chart (dominant) -->
  <div class="fd-chart-area">
    <div id="emptyPanel" class="fd-empty">
      <mat-icon id="emptyIcon">analytics</mat-icon>
      <p id="emptyMsg">Loading…</p>
    </div>
    <div id="chartEl" class="fd-chart"></div>
  </div>

  <!-- Status bar -->
  <div id="sb" class="fd-sb"></div>

  <!-- Settings dialog -->
  <div id="settingsModal" class="fd-overlay" style="display:none">
    <div class="fd-dlg">
      <div class="fd-dlg-hd">Widget Settings</div>
      <label class="fd-lbl">Server Base URL
        <input id="cfgUrl" class="fd-fw-input" type="text" placeholder="http://localhost:8000" />
      </label>
      <label class="fd-lbl">API Token
        <input id="cfgToken" class="fd-fw-input" type="text" placeholder="jessica" />
      </label>
      <div class="fd-dlg-ft">
        <button id="cfgCancel" class="fd-btn fd-btn-cancel">Cancel</button>
        <button id="cfgSave" class="fd-btn fd-btn-save">Save &amp; Refresh</button>
      </div>
    </div>
  </div>

</div>
