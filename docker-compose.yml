  ws-events:
    build:
      context: ./send-telemetry/
      dockerfile: ws-events.Dockerfile
    container_name: ws-events
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      thingsboard:
        condition: service_healthy
    networks:
      - thingsboard
    volumes:
      - application_source_code:/app

  dashboard-script:
    build:
      context: ./send-telemetry/
      dockerfile: dashboard-script.Dockerfile
    container_name: dashboard-script
    # mem_limit: 512m
    # cpus: 0.5
    depends_on:
      thingsboard:
        condition: service_healthy
    volumes:
      - application_source_code:/app
    networks:
      - thingsboard

  model:
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    container_name: model
    # mem_limit: 2g
    # mem_reservation: 512mb
    # cpus: 0.75
    volumes:
      - application_source_code:/app
      - application_pip_cache:/root/.cache/pip
      - application_models_cache:/models
    depends_on:
      - database
    ports:
      - "8000:8000"
    networks:
      - thingsboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file:
      - ./.env
    environment:
      - WAIT_HOSTS=database:5432
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - AccountSid=${ACCOUNT_SID:-defaultSid}
      - AccountToken=${ACCOUNT_TOKEN:-defaultToken}
      - TwilioSmsFrom=${TWILIO_SMS_FROM:-+1234567890}
      - PhoneNumberID=${PHONE_NUMBER_ID:-123456789}
      - WB_TOKEN=${WB_TOKEN:-defaultWBToken}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-test@example.com}
      - APP_PASSWORD=${APP_PASSWORD:-defaultPassword}
      - MODELS_PATH=/models
      - AUTO_START_PREDICTION_JOBS=${AUTO_START_PREDICTION_JOBS:-false}
      - ENABLE_FILE_WATCH=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

  thingsboard:
    container_name: thingsboard
    build:
      context: .
      dockerfile: .Dockerfile
    # mem_limit: 3g
    # mem_reservation: 512m
    # cpus: 2.0
    volumes:
      - application_source_code:/app
      - application_m2_cache:/root/.m2
      - application_npm_cache:/root/.npm
      - application_gradle_cache:/root/.gradle
    ports:
      - "8080:8080"
      - "1883:1883"
      - "7071:7071"
      - "8883:8883"
    networks:
      - thingsboard
    depends_on:
      database:
        condition: service_healthy
      model:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      - WAIT_HOSTS=database:5432,model:8000
      - FASTAPI_BASE_URL=http://model:8000/api/v1/
      - FASTAPI_WS_URL=ws://model:8000/models/ws/unified
      # Java heap size: 2GB as recommended by ThingsBoard docs
      - JAVA_OPTS=-Xms2G -Xmx2G -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      # Changed to false - only load once, not on every startup
      - PM_LOAD_SAMPLE_DATA=true
      - PM_LOAD_SAMPLE_DATA_UPDATE_TO_CURRENT_TIME=true
      - PM_AUTO_LOAD_ON_STARTUP=false
      - PM_TENANT_EMAIL=${PM_TENANT_EMAIL:-tenant@thingsboard.org}
      - PM_MACHINE_IDS=${PM_MACHINE_IDS:-1,11}
      - PM_MAX_MACHINES=${PM_MAX_MACHINES:-10}
      - PM_ROLLBACK_ON_FAILURE=${PM_ROLLBACK_ON_FAILURE:-true}
      - PM_EXIT_ON_FAILURE=${PM_EXIT_ON_FAILURE:-true}
      - PM_END_DATE_MACHINES=${PM_END_DATE_MACHINES:-2015-04-20 06:00:00,2024-12-31 00:00:00}
      - PM_DATA_PATH=${PM_DATA_PATH:-predictive-maintenance/data}

  ui-ngx:
    build:
      context: ui-ngx
      dockerfile: .Dockerfile
    container_name: thingsboard-dev
    # mem_limit: 10g
    # mem_reservation: 1g
    # cpus: 1.0
    volumes:
      - application_source_code:/app
      - application_npm_cache:/root/.npm
    ports:
      - "4200:4200"
    networks:
      - thingsboard
    depends_on:
      thingsboard:
        condition: service_healthy
    environment:
      - WAIT_HOSTS=thingsboard:8080
      # Keep 8GB for stability
      - NODE_OPTIONS=--max-old-space-size=8192
      # Disable polling to reduce CPU usage
      - CHOKIDAR_USEPOLLING=false
      # Increase debounce interval to reduce file watch overhead
      - CHOKIDAR_INTERVAL=3000
      # Disable analytics
      - NG_CLI_ANALYTICS=false
      # Reduce TypeScript compilation overhead
      - NG_BUILD_CACHE=.angular/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200 || exit 1"]
      interval: 3m
      timeout: 30s
      retries: 3
      start_period: 90s

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../psql_data/main
  application_source_code:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: .
  application_m2_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../thingsboard_m2_cache
  application_npm_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../thingsboard_npm_cache/
  application_gradle_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../thingsboard_gradle/
  application_pip_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../thingsboard_pip_cache/
  application_models_cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../thingsboard_models_cache/

networks:
  thingsboard:
