services:
  database:
    image: postgres:16
    container_name: database
    restart: on-failure:3
    # mem_limit: 1g
    # cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - application_source_code:/app
    networks:
      - thingsboard
    env_file:
      - ./.env
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=16MB"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready",
          "-d",
          "${POSTGRES_DB}",
          "-U",
          "${POSTGRES_USER}",
        ]
      interval: 2m
      timeout: 30s
      retries: 3
      start_period: 80s

  # Commented out - uncomment only when needed
