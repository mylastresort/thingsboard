name: tb-lts43-monolith-merge

services:
  postgres:
    restart: always
    image: "postgres:18"
    container_name: tb-lts43-monolith-postgres
    ports:
      - "5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../psql_data-merge:/var/lib/postgresql
      - .:/app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  model:
    build:
      context: ./predictive-maintenance
      dockerfile: .Dockerfile
    container_name: tb-lts43-monolith-model
    volumes:
      - .:/app
      - pip-cache:/root/.cache/pip
      - models-cache:/models
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - WAIT_HOSTS=postgres:5432
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-thingsboard}
      - MODELS_PATH=/models
      - AUTO_START_PREDICTION_JOBS=${AUTO_START_PREDICTION_JOBS:-false}
      - ENABLE_FILE_WATCH=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AccountSid=${ACCOUNT_SID:-defaultSid}
      - AccountToken=${ACCOUNT_TOKEN:-defaultToken}
      - TwilioSmsFrom=${TWILIO_SMS_FROM:-+1234567890}
      - PhoneNumberID=${PHONE_NUMBER_ID:-123456789}
      - WB_TOKEN=${WB_TOKEN:-defaultWBToken}
      - EMAIL_ADDRESS=${EMAIL_ADDRESS:-test@example.com}
      - APP_PASSWORD=${APP_PASSWORD:-defaultPassword}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 60s

  thingsboard:
    # restart: always
    image: "${DOCKER_REPO}/${TB_NODE_DOCKER_NAME}:${TB_VERSION}"
    container_name: tb-lts43-monolith-node
    volumes:
      - ./tb-config:/config
    ports:
      - "8080:8080"
      - "7070:7070"
      - "1883:1883"
      - "8883:8883"
      - "5683-5688:5683-5688/udp"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    environment:
      TB_SERVICE_ID: tb-ce-node
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TB_QUEUE_TYPE: in-memory
      FASTAPI_BASE_URL: http://model:8000/api/v1/
      FASTAPI_WS_URL: ws://model:8000/models/ws/unified
      LOGGING_LEVEL_ORG_THINGSBOARD: INFO                          # base: no more DEBUG floods
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_CONTROLLER: DEBUG       # keep REST controller detail
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_TRANSPORT: DEBUG        # keep MQTT/CoAP detail

      # Silence the worst offenders explicitly
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_SERVICE_QUEUE: WARN
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_ACTORS_SERVICE: WARN
      LOGGING_LEVEL_ORG_THINGSBOARD_SERVER_ACTORS_RULECHAIN: WARN
    depends_on:
      postgres:
        condition: service_healthy
      # model:
      #   condition: service_healthy
    env_file:
      - .env
    # no healthcheck — actuator/health not available in this build;
    # tb-web-ui-dev uses service_started below and lets the proxy retry

  # Commented out — uncomment only when needed
  # anomalies-script:
  #   build:
  #     context: ./send-telemetry
  #     dockerfile: anomalies-script.Dockerfile
  #   container_name: tb-lts43-monolith-anomalies-script
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     thingsboard:
  #       condition: service_started

  # forecast-script:
  #   build:
  #     context: ./send-telemetry
  #     dockerfile: forecast-script.Dockerfile
  #   container_name: tb-lts43-monolith-forecast-script
  #   volumes:
  #     - .:/app
  #   depends_on:
  #     thingsboard:
  #       condition: service_started

  ws-events:
    build:
      context: ./send-telemetry
      dockerfile: ws-events.Dockerfile
    container_name: tb-lts43-monolith-ws-events
    volumes:
      - .:/app
    depends_on:
      thingsboard:
        condition: service_started

  dashboard-script:
    build:
      context: ./send-telemetry
      dockerfile: dashboard-script.Dockerfile
    container_name: tb-lts43-monolith-dashboard-script
    volumes:
      - .:/app
    depends_on:
      thingsboard:
        condition: service_started

  tb-web-ui-dev:
    build:
      context: ./ui-ngx
      dockerfile: .Dockerfile
    container_name: tb-lts43-monolith-tb-web-ui-dev
    working_dir: /app
    volumes:
      - ./ui-ngx:/app
    environment:
      - HOSTS=http://node:8080
      - MODEL_URL=http://model:8000
    command: sh ./entrypoint.sh
    ports:
      - "4200:4200"
    depends_on:
      thingsboard:
        condition: service_started # downgraded — no healthcheck to wait on


  tb-web-ui:
    build:
      context: .                        # ← repo root
      dockerfile: msa/web-ui/Dockerfile
    container_name: tb-lts43-monolith-tb-web-ui
    ports:
      - "8090:8090"
    environment:
      - TB_ENABLE_PROXY=true
      - TB_HOST=thingsboard
      - TB_PORT=8080
      - HTTP_BIND_ADDRESS=0.0.0.0
      - HTTP_BIND_PORT=8090
    depends_on:
      thingsboard:
        condition: service_started
    restart: unless-stopped

volumes:
  pip-cache:
    driver: local
  models-cache:
    driver: local
